name: Fork Sync Upstream

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with fork-update-versions so the two never push to main concurrently.
concurrency:
  group: fork-main-writer
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'agentclientprotocol/registry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Merges that touch .github/workflows need a token with the `workflow` scope.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/agentclientprotocol/registry.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            python3 .github/fork/fork_tools.py resolve-conflicts
            git commit --no-edit
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Validate registry build
        run: uv run --with jsonschema .github/workflows/build_registry.py --dry-run

      - name: Push to main
        run: git push origin HEAD:main

      - name: Report failure
        if: failure()
        run: |
          # The fork has issues disabled, so report through the run summary instead.
          {
            echo "## Fork sync with upstream failed"
            echo
            echo "Merge \`upstream/main\` locally, resolve the conflicts, then push to \`main\`."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Fork sync with upstream failed::Merge upstream/main locally, resolve the conflicts, then push to main."
