name: Fork Publish Registry

on:
  push:
    branches: [main]
    paths:
      - "*/agent.json"
      - "*/icon.svg"
      - "*.schema.json"
  # Pushes made with GITHUB_TOKEN (fork-update-versions) do not trigger `push`.
  workflow_run:
    workflows: ["Fork Update Versions", "Fork Sync Upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository != 'agentclientprotocol/registry' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build registry
        env:
          REGISTRY_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run --with jsonschema .github/workflows/build_registry.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}registry.json
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
