name: Fork Publish Registry

on:
  push:
    branches: [main]
    paths:
      - "*/agent.json"
      - "*/icon.svg"
      - "*.schema.json"
      - ".github/workflows/build_registry.py"
  # Pushes made with GITHUB_TOKEN (fork-update-versions) do not trigger `push`;
  # fork-sync-upstream pushes with FORK_SYNC_TOKEN, so `push` covers it.
  workflow_run:
    workflows: ["Fork Update Versions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      github.repository != 'agentclientprotocol/registry' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The update run checked out RUN_HEAD_SHA; main is unchanged if it pushed nothing.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$MAIN_SHA" = "$RUN_HEAD_SHA" ]; then
              echo "No new commits on main; skipping publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build registry
        env:
          REGISTRY_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run --with jsonschema .github/workflows/build_registry.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}registry.json
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
